/* Static product storyboard. No backend, repository, model or persistent storage access. */
const scenes = [
 ['安装与启动','安装完成','确认安装结果，打开个人工作站。','点击打开；不要求启动服务或复制令牌。','桌面安装与宿主尚未实现；这里展示目标体验。'],
 ['首次配置','第一次打开','理解软件用途，选择是否现在配置 Agent。','先配置一个工具即可；其余以后添加。','没有配置时允许浏览项目，执行入口说明缺少什么。'],
 ['首次配置','连接你的 Agent','区分工具安装、登录状态和实际执行能力。','检测本机工具，命名配置并保存；账号登录在所属工具完成。','检测不调用模型；真实调用另需明确同意。'],
 ['项目入口','项目首页 · 空状态','从零开始或接入正在开发的项目。','创建项目仅建立组织空间；不会自动执行任务。','首次为空，不混入演示项目。'],
 ['项目入口','从零创建项目','描述目标，确定代码保存位置。','填写名称与目标，明确同意新建文件夹和仓库。','新建仓库属于待开发能力；已有目录不能被覆盖。'],
 ['项目入口','接入已有项目','保留已有代码，确认当前状态和后续基线。','先只读检查，再确认 commit 与未提交改动处理方式。','检查、关联和执行授权分开；无提交时先建立基线。'],
 ['项目规划','新项目工作区','项目建立后，知道如何开始安排工作。','选择手动添加任务，或请已配置的负责人起草。','负责人建议需要调用模型；生成建议不等于批准执行。'],
 ['项目规划','角色、Agent 与负责人','看清每个 Agent 的职责，允许同工具多个实例。','选择已配置实例，填写项目内职责，指定一名负责人。','角色可复用；工作区属于任务，成员不是另一位人类用户。'],
 ['项目规划','安排任务','用目标、执行者和完成条件描述一项工作。','先建立可理解的单个任务，再按需要添加依赖。','内部 ID、绑定和修订隐藏在技术详情；不能绕过服务门禁。'],
 ['项目规划','审阅计划并批准','知道批准的具体工作、代码范围和启动方式。','可批准全部或依赖完整的子集；另行选择开始。','保存、批准、建立任务和启动分别记录；未知结果不自动重试。'],
 ['开发与协作','项目流程与进展','谁负责什么、到哪一步、为什么等待一眼可见。','点击任务进入会话；查看待处理；需要时审阅计划调整。','图是依赖关系，组是工作拆分；并行仍是目标能力。'],
 ['开发与协作','任务会话','向当前 Agent 下达反馈，了解本轮执行情况。','看回复与执行记录，提出修改；辅助信息可以收起。','每任务独立会话；模型未报告时不以配置值冒充实际值。'],
 ['开发与协作','临时并排会话','同时参考两项工作的上下文，避免串发消息。','主动选择第二任务；两个输入框明确标注接收者。','并排查看不代表并行执行；窄窗口上下排列。'],
 ['开发与协作','审查并确认成果','看改动、检查与验收条件，再决定是否认可。','确认成果并完成该任务，或提出修改。','一次明确操作可分别存接受和节点确认，属于待评审接口调整；不等于集成。'],
 ['开发与协作','显式交接','将具体成果交给指定任务，不假设共享全部历史。','编辑交接内容，确认接收者和版本后发送。','投递、接收确认和已读不是同一个状态；当前尚未实现。'],
 ['交付与收尾','集成与联合检查','把已确认成果放到一起，发现冲突或功能不兼容。','审阅来源与目标，在专用分支集成并检查。','不得自动切换用户分支、推送或部署；冲突需要明确处理。'],
 ['交付与收尾','最终验收与保留','判断当前迭代是否达到目标，并保留可追溯结果。','确认具体集成版本和联合检查结果；继续下一轮或归档。','归档不删除代码；仅当前迭代完成，不把所有历史检查视为有效。'],
 ['边界场景','失败、断线与待恢复','知道什么失败了，哪些操作仍然安全。','读取事实，保留输入；只提供有证据支持的恢复。','断线不等于进程停止；未知执行不自动重发或假装完成。'],
 ['边界场景','关闭、通知与再次打开','离开窗口也不丢失任务，停止有真实结果。','选择后台继续或停止后退出；再次打开先回项目首页。','后台宿主、系统通知、双平台恢复均为目标；停止不回滚代码。']
];
let current = Math.max(0, Math.min(scenes.length-1, Number(location.hash.slice(1)) || 0));
let showDetails = true;
const $ = s => document.querySelector(s);
const icon = tool => agentIcon(tool);
const badge = (text,kind='') => `<span class="pill ${kind}">${text}</span>`;
const button = (text,to,primary=false) => `<button ${to===undefined?'data-note="这是静态画面，请从页面目录查看对应阶段。"':`data-scene="${to}"`} class="${primary?'primary':''}">${text}</button>`;
const field = (name,value,help='',large=false) => `<label class="field"><span>${name}</span>${large?`<textarea rows="3">${value}</textarea>`:`<input value="${value}">`}${help?`<small>${help}</small>`:''}</label>`;
const select = (name,options) => `<label class="field"><span>${name}</span><select>${options.map(x=>`<option>${x}</option>`).join('')}</select></label>`;
const check = (text,checked=false) => `<label class="checkline"><input type="checkbox" ${checked?'checked':''}><span>${text}</span></label>`;
const box = (title,body,cls='') => `<section class="panel ${cls}"><h2>${title}</h2>${body}</section>`;
const hint = (text,kind='') => `<div class="noticebox ${kind}">${text}</div>`;
const rows = items => `<div class="rows">${items.map(([title,desc,state,kind])=>`<div class="item"><div><strong>${title}</strong><p>${desc}</p></div>${badge(state,kind)}</div>`).join('')}</div>`;
const heading = (title,desc,actions='') => `<div class="intro"><div><h1>${title}</h1><p class="lead">${desc}</p></div><div class="actions">${actions}</div></div>`;
const actions = html => `<div class="formactions">${html}</div>`;
function roster(){return rows([
 [`${icon('Codex')} 项目协调`,'Codex · 规划、整理进展与交接建议','负责人','blue'],
 [`${icon('Claude Code')} 页面助手`,'Claude Code · 页面和交互','已配置',''],
 [`${icon('Codex')} 接口助手`,'Codex · 接口、数据与后端检查','已配置',''],
 [`${icon('DeepSeek Harness')} 文案助手`,'DeepSeek Harness · 项目介绍与辅助文档','已配置','']]);}
function taskSidebar(){return `<div class="tasklist"><h3>其他任务</h3><button data-scene="11">前端 · 首页开发<small>页面助手 · Claude Code · 执行中</small></button><button data-scene="13">后端 · 联系接口<small>接口助手 · Codex · 待你确认</small></button><button data-scene="10">检查 · 联合检查<small>检查助手 · Codex · 等待前置任务</small></button></div>`;}
function frame(body,project=false,task=false){return `<div class="app"><aside class="sidebar"><button class="globalback" data-scene="${task?10:project?3:0}" ${current===0?'disabled':''}>← <span class="backtext">返回</span></button><div class="brand"><span class="brandmark">A</span><span>AgentDesk</span></div><nav class="nav"><button data-scene="3" class="${!project?'active':''}">▦　项目</button>${project?`<div class="navlabel">个人作品集</div><button data-scene="10" class="${!task?'active':''}">⑂　项目流程</button><button data-scene="13">◷　需要我处理 <span class="count">2</span></button><button data-scene="7">♙　角色与 Agent</button>`:`<button data-scene="2">⚙　Agent 配置</button>`}</nav>${task?taskSidebar():''}<div class="sidefoot">个人开发工作站<br>代码编辑使用外部 IDE<br>此处均为设计示例</div></aside><main class="main"><header class="topbar"><div class="crumb">${project?`项目　/　个人作品集${task?'　/　联系接口':''}`:'我的工作站'}</div><div class="topactions">${button(project?'项目设置':'偏好设置',project?7:2)}</div></header>${body}</main></div>`;}
function flowNode(role,name,agent,tool,status,kind,cause,to){return `<button class="flow-node ${kind}" data-scene="${to}"><span class="role">${role}</span><h3>${name}</h3><div class="identity">${icon(tool)} ${agent} · ${tool}</div><div class="node-meta"><span>模型未报告</span>${badge(status,kind)}</div>${cause?`<p class="cause">${cause}</p>`:''}</button>`;}
function graph(){return `<div class="graph-canvas"><div class="group-title">⌄　个人作品集 · 首个可用版本</div><div class="phaseheads"><span>01　目标与约定</span><span>02　分工开发</span><span>03　集成与检查</span></div><div class="flow-grid"><svg viewBox="0 0 1000 440" preserveAspectRatio="none" aria-hidden="true"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#a4b4d0"/></marker></defs><path d="M280 220 C335 220 330 100 365 100 M280 220 C335 220 330 340 365 340 M645 100 C700 100 685 220 730 220 M645 340 C700 340 685 220 730 220" fill="none" stroke="#b9c6dc" stroke-width="1.5" marker-end="url(#arrow)"/></svg><div class="flow-col centered">${flowNode('负责人','目标与接口约定','项目协调','Codex','已确认','green','内容范围与接口字段已确认',9)}</div><div class="flow-col">${flowNode('前端','首页开发','页面助手','Claude Code','执行中','blue','本轮执行尚未结束',11)}${flowNode('后端','联系接口','接口助手','Codex','待你确认','purple','成果已提交，等你审阅',13)}</div><div class="flow-col centered">${flowNode('检查','页面与接口联合检查','检查助手','Codex','等待','amber','等待前后端成果确认并集成',15)}</div></div><p class="graph-caption">连线表示执行依赖；任务分组表示工作拆分。点击任务查看会话和成果。</p></div>`;}
function chat(name,tool,second=false){return `<section class="conversation"><header class="chatname"><strong class="identity">${icon(tool)} ${name} · ${tool}</strong>${badge(second?'执行中':'待你确认',second?'blue':'purple')}</header><div class="messages"><div class="message user"><div class="by">你 · 14:20</div><p>${second?'首页先完成介绍、作品列表和联系入口，使用浅色布局。':'实现联系表单接口，校验必填字段，并返回清楚的错误信息。'}</p></div><div class="message"><div class="by identity">${icon(tool)} ${name} · 14:26</div><p>${second?'首页结构已经建立，正在调整窄窗口布局。接口尚未确认，目前使用示例数据。':'联系接口已实现，补充了成功提交、缺少字段和无效邮箱的检查。请审阅成果后再交给前端。'}</p>${second?'':`<pre>POST /api/contact\n200 → { message: "received" }\n422 → { code: "invalid_email" }</pre><div class="evidence"><strong>本轮成果 · 等你确认</strong><p>3 个文件改动 · 本任务检查通过 · 尚未集成</p><div class="actions">${button('查看并确认成果',13,true)}${button('准备交接',14)}</div></div>`}<details><summary>查看本轮执行记录</summary><p>开始执行 → 修改文件 → 运行任务检查 → 本轮结束（示例）</p></details></div></div><div class="composer"><label><span class="sr">向${name}发送修改要求</span><textarea placeholder="向${name}提出修改要求…"></textarea></label><div class="composerfoot"><span>发送后继续当前任务 · 会消耗模型额度</span>${button('发送并继续',undefined,true)}</div></div></section>`;}

case 1:return frame(`<div class="centerpage">${heading('欢迎使用 AgentDesk','一个人，也能清楚地组织多个 Agent。')}${box('先连接一个 Agent',`<p>继续使用你已有的 Codex、Claude Code 或 DeepSeek Harness 配置。软件不会代替你购买模型或创建账号。</p><ol class="steps"><li>连接工具，给配置起一个好认的名字</li><li>创建项目，描述你想做什么</li><li>安排任务，审阅后开始执行</li></ol>${actions(button('稍后配置，先看项目',3)+button('配置第一个 Agent',2,true))}`)}</div>`);

case 4:return frame(`<div class="centerpage">${heading('创建项目','先说清楚你想做什么。')}${box('项目信息',`${field('项目名称','个人作品集')}${field('项目目标','介绍自己，展示作品，并提供联系入口。','负责人可根据这些内容起草任务；你也可以手动安排。',true)}${select('代码从哪里开始',['新建代码仓库','暂时只建立项目，稍后准备代码'])}${field('保存位置','文档 / 开发项目 / 个人作品集','选择一个新目录，不覆盖已有文件。')}${button('选择文件夹')}${check('同意在所选位置新建项目文件夹和 Git 仓库')}${hint('创建不会调用模型，也不会自动开始开发。若目标目录已有文件，先核对或改用“接入已有项目”。')}${actions(button('取消',3)+button('创建并进入项目',6,true))}`)}</div>`);
case 5:return frame(`<div class="content">${heading('接入已有项目','从已有成果继续，不重置或覆盖你的代码。')}<div class="two-col">${box('选择与检查',`${field('项目名称','已有个人网站')}${field('Git 仓库目录','我的项目 / portfolio')}${button('选择目录')}${button('检查仓库')}${rows([['当前分支','main','有提交','green'],['未提交改动','已修改 2 个文件，新增 1 个文件','需要留意','amber'],['已有工作区','检测到 1 个 worktree','只读检查','']])}`)}${box('确认接入依据',`<p>本次使用已提交的代码开始新任务，原目录的未提交改动保持原样。</p><details><summary>查看 commit 与仓库详情</summary><pre>分支：main\n基线：已检查的完整 commit\n已有 worktree：保留，不接管</pre></details>${check('我知道未提交改动不会自动进入新任务工作区')}${field('已经完成什么，还想继续做什么','首页已有雏形；需要补充联系功能与手机布局。','已有功能先由你确认，不因代码存在就标记为验证完成。',true)}${hint('尚无 commit：先在 IDE 中建立可确认的代码基线，再重新检查。执行权限另行明确配置，不因关联而自动获得。')}${actions(button('重新检查')+button('确认并进入项目',6,true))}`)}</div></div>`);
case 6:return frame(`<div class="content">${heading('个人作品集','介绍自己，展示作品，并提供联系入口。',button('项目设置',7))}<nav class="tabs"><button class="selected">项目流程</button><button data-scene="7">角色与 Agent</button></nav><div class="empty"><h2>先安排第一项工作</h2><p>可以从一个小任务开始，也可以请负责人建议如何拆分。所有建议都由你审阅后执行。</p><div class="actions center">${button('手动添加任务',8,true)}${button('请负责人起草计划',7)}</div></div>${box('代码准备',`<p>新仓库已创建（设计示例）。任务开始前，会建立独立工作区并固定代码基线。</p><details><summary>查看代码位置</summary><p>文档 / 开发项目 / 个人作品集</p></details>`)}</div>`,true);

case 8:return frame(`<div class="centerpage">${heading('添加任务','说清楚做什么、谁来做、怎样算完成。')}${box('任务内容',`${field('任务名称','搭建首页')}${field('希望完成什么','包含个人介绍、作品列表和联系入口，适配手机。','不要把整个项目都塞进第一个任务。',true)}${select('交给谁',['页面助手 · Claude Code · 前端开发','接口助手 · Codex · 后端开发'])}${field('完成条件','包含三个内容区域\n桌面和手机上都可阅读','每行一条，供检查和最后确认使用。',true)}<details><summary>分组、前置任务与代码设置</summary>${select('所属分组',['首个可用版本'])}${select('开始前需要完成什么',['没有前置任务','需求与接口约定'])}<p>代码基线、工作区与执行配置在批准前统一核对。</p></details>${actions(button('返回',6)+button('保存，审阅计划',9,true))}`)}</div>`,true);

case 10:return frame(`<section class="overviewhead">${heading('个人作品集','首个可用版本 · 首页、联系接口和项目介绍',button('＋ 添加任务',8))}<nav class="tabs"><button class="selected">项目流程</button><button data-scene="13">需要我处理 2</button><button data-scene="7">角色与 Agent</button></nav></section><div class="planhint"><span><strong>负责人提出一项建议</strong>　增加联系表单异常测试，尚未执行。</span>${button('审阅建议',9)}</div><div class="graphbar"><div class="actions">${button('层级视图')}${button('任务列表',7)}</div><div class="legend">● 已确认　● 执行中　● 待你确认　● 等待依赖</div></div>${graph()}<div class="belowgraph">${button('查看交接',14)}${button('查看集成计划',15)}</div>`,true);
case 11:return frame(`<section class="taskhead">${heading('后端 · 联系接口','实现提交与字段校验，为前端提供可用接口。',button('并排查看另一会话',12)+`<button data-details>${showDetails?'收起':'展开'}详情</button>`)}<nav class="tabs"><button class="selected">会话</button><button data-scene="13">成果与检查</button><button data-note="工作区页面展示任务路径、分支、基线及 IDE / 终端入口，不提供完整代码编辑器。">工作区</button></nav></section><div class="taskbody">${chat('接口助手','Codex')}${showDetails?`<aside class="details"><h2>任务详情</h2><dl><dt>执行者</dt><dd>${icon('Codex')} 接口助手 · Codex</dd><dt>本轮模型</dt><dd>未报告<br>配置模型与实际报告分开展示</dd><dt>前置任务</dt><dd>目标与接口约定 · 已确认</dd><dt>后续影响</dt><dd>前端对接、联合检查</dd><dt>代码位置</dt><dd class="mono">agentdesk/contact-api</dd></dl>${button('在 IDE 中打开')}<details><summary>技术详情</summary><p>配置修订、代码基线和会话归属按需查看。</p></details></aside>`:''}</div>`,true,true);

function render(){const s=scenes[current]; document.title=`AgentDesk 设计稿 · ${s[1]}`; $('#journey').innerHTML=`<header class="reviewbar"><strong>AgentDesk · 全流程设计稿</strong><span>示例画面，不连接工具、不读取仓库、不执行操作</span><a href="/?legacy=1">原设计稿</a><button data-review-toggle>页面目录 ☰</button></header><div class="review-layout"><aside class="review-index"><h2>评审目录</h2><p>按安装到验收的顺序浏览</p>${scenes.map((x,n)=>`${n===0||x[0]!==scenes[n-1][0]?`<h3>${x[0]}</h3>`:''}<button class="${n===current?'selected':''}" data-scene="${n}"><span>${String(n+1).padStart(2,'0')}</span>${x[1]}</button>`).join('')}</aside><div class="review-stage">${content(current)}<section class="review-notes"><div><small>这个页面解决什么</small><p>${s[2]}</p></div><div><small>用户怎么操作</small><p>${s[3]}</p></div><div><small>实现与评审边界</small><p>${s[4]}</p></div></section><footer class="review-footer">${button('← 上一页',Math.max(0,current-1))}<span>${current+1} / ${scenes.length} · ${s[1]}</span>${button(current===scenes.length-1?'回到第一步':'下一页 →',current===scenes.length-1?0:current+1,true)}</footer></div></div><div id="design-toast" role="status"></div>`;}
document.addEventListener('click',e=>{const target=e.target.closest('button');if(!target)return;if(target.dataset.scene!==undefined){location.hash=target.dataset.scene; if(current===Number(target.dataset.scene))render();}else if(target.hasAttribute('data-details')){showDetails=!showDetails;render();}else if(target.hasAttribute('data-review-toggle')){$('.review-index').classList.toggle('open');}else if(target.dataset.note){$('#design-toast').textContent=target.dataset.note;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>{$('#design-toast').textContent='';},3500);}});
window.addEventListener('hashchange',()=>{current=Math.max(0,Math.min(scenes.length-1,Number(location.hash.slice(1))||0));render();window.scrollTo(0,0);});
render();
</script></body></html>
