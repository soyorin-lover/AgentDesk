function agentIcon(tool){const key=tool==='Codex'?'codex':tool==='Claude Code'?'claude':tool==='DeepSeek Harness'?'deepseek':null;return key?agentIcons[key]:'';}
const tasks = {
 plan:{role:'负责人',name:'需求与接口约定',tool:'Codex',status:'done',label:'已确认',goal:'明确登录范围、接口字段和前后端验收条件。',branch:'codex/login-contract',dependency:'无前置依赖',model:'配置模型 · 示例'},
 front:{role:'前端',name:'登录页面',tool:'Claude Code',status:'blocked',label:'等待交接',goal:'实现登录表单、错误提示及登录后的跳转，依据已确认的接口约定。',branch:'agentdesk/login-ui',dependency:'后端 · 登录接口：待确认成果并交接',model:'配置模型 · 示例'},
 back:{role:'后端',name:'登录接口',tool:'Codex',status:'review',label:'待你确认',goal:'实现登录接口、会话校验和错误处理，提供可交接的接口说明及测试证据。',branch:'agentdesk/login-api',dependency:'负责人 · 需求与接口约定：已确认',model:'配置模型 · 示例'},
 test:{role:'测试',name:'登录链路集成验证',tool:'DeepSeek Harness',status:'blocked',label:'等待依赖',goal:'将已确认前后端成果集成到专用分支，验证登录成功、失败和退出场景。',branch:'agentdesk/login-integration',dependency:'前端 · 登录页面；后端 · 登录接口',model:'配置模型 · 示例'}
};
const state={page:'home',project:'sample',task:'back',tab:'flow',taskTab:'chat',compare:false,details:true,zoom:1,tree:false,proposal:true,imported:[],drafts:{},messages:{},accepted:false};
function project(){return state.project==='sample'?{name:'个人网站',description:'登录功能迭代 · 让前后端协作在同一条流程中推进',sample:true}:state.imported.find(p=>p.id===state.project);}
function pending(){return state.accepted?1:2;}
function sidebar(){const home=state.page==='home';return `<aside class='sidebar'><button class='globalback' data-act='global-back' aria-label='${home?'已在项目首页':state.page==='task'?'返回项目流程':'返回项目首页'}' ${home?'disabled':''}>←<span class='backtext'>返回</span></button><div class='brand'><span class='brandmark'>A</span><span>AgentDesk</span></div><nav class='nav'><button data-act='home' class='${home?'active':''}'><span>▦</span><span class='navtext'>项目</span></button>${!home?`<div class='navlabel'>当前项目</div><button data-act='flow' class='${state.page==='flow'&&state.tab==='flow'?'active':''}'><span>⑂</span><span class='navtext'>项目流程</span></button><button data-act='attention' class='${state.tab==='attention'&&state.page==='flow'?'active':''}'><span>◷</span><span class='navtext'>需要我处理</span><span class='count'>${project().sample?pending():0}</span></button><button data-act='roles'><span>♙</span><span class='navtext'>角色与 Agent</span></button>`:''}</nav><div class='sidefoot'>开发者协作工作台<br>本预览仅保存临时内存状态<br>刷新后恢复设计示例</div></aside>`;}
function chrome(inner){return `<div class='app'>${sidebar()}<main class='main'>${inner}</main></div>`;}
function header(){return `<header class='topbar'><div class='crumb'><button class='quiet' data-act='home'>项目</button><span>/</span><span>${esc(project().name)}</span>${project().sample?`<span class='tag'>协作示例</span>`:''}</div><div class='topactions'><button class='small quiet' data-act='reminder'>预览提醒</button><button class='small' data-act='settings'>项目设置</button></div></header>`;}
function home(){const cards=state.imported.map(p=>`<article class='projectcard'><div class='projecticon'>▱</div><h2>${esc(p.name)}</h2><p>${esc(p.description||'新建项目空间，尚未规划工作。')}</p><div class='cardfoot'><span>${p.path?'仓库路径待核对':'尚未关联仓库'}</span><button class='small' data-act='open-project' data-id='${p.id}'>进入项目 →</button></div></article>`).join('');return chrome(`<header class='topbar'><span class='muted'>工作空间</span><button class='small quiet' data-act='settings'>连接与偏好</button></header><div class='content'><div class='intro'><div><div class='eyebrow'>YOUR WORKSPACE</div><h1>项目</h1><p class='lead'>把同一项目的分工、会话与进展放在一起。</p></div><div class='actions'><button data-act='import'>接入已有项目</button><button class='primary' data-act='create'>＋ 创建项目</button></div></div><section class='startbox'><div><h2>${cards?'继续推进你的项目':'从你的项目开始'}</h2><p>建立一个项目空间，配置分工，再组织 Agent 并行推进工作。<br>已有代码可以直接接入，无需重新开始或补录全部历史。</p></div><button data-act='create'>${cards?'创建项目':'创建第一个项目'} →</button></section><div class='sectionline'><div><h2>我的项目 ${state.imported.length?`<span class='muted'>${state.imported.length}</span>`:''}</h2><p>${cards?'仅本次预览中创建，刷新后清空。':'还没有项目。创建项目不会立即调用 Agent 或修改代码。'}</p></div></div>${cards?`<div class='projectgrid'>${cards}</div>`:''}<div class='sectionline'><div><h2>先看看协作会怎样展开</h2><p>以下是独立设计示例，不是你的仓库或正在运行的 Agent。</p></div></div><div class='projectgrid'><article class='projectcard'><div class='row between'><div class='projecticon'>⑂</div><span class='tag'>交互示例</span></div><h2>个人网站 · 登录功能迭代</h2><p>负责人确认接口约定，前后端独立开发，测试角色负责集成验证。</p><div class='cardfoot'><span>4 个工作节点 · 3 种 Agent</span><button class='small' data-act='sample'>打开协作示例 →</button></div></article></div></div>`);}
function node(id,x,y){const t=tasks[id];return `<button class='node ${id==='back'&&!state.accepted?'attention':''}' style='left:${x}px;top:${y}px' data-act='task' data-id='${id}'><div class='nodetop'><span class='role'>${t.role}</span>${id==='back'&&!state.accepted?`<span class='badge' aria-label='1 项待确认'>1</span>`:''}</div><h3>${t.role} · ${t.name}</h3><div class='nodebottom'><span class='agentidentity'>${agentIcon(t.tool)}${t.tool} · 配置模型</span><span class='state ${t.status}'>${t.label}</span></div>${t.status==='blocked'?`<div class='nodecause'>${id==='front'?(state.accepted?'等待：后端接口交接':'等待：后端成果确认与接口交接'):'等待：前后端成果确认'}</div>`:''}</button>`;}
function graph(){if(!project().sample)return `<div class='empty'><div class='eyebrow'>PROJECT READY</div><h2>先确定接下来要做的工作</h2><p>项目空间已建立。可以手动添加节点，也可以配置负责人，让它提出流程草案，再由你调整确认。</p><div class='actions' style='justify-content:center'><button data-act='manual'>＋ 添加工作节点</button><button class='primary' data-act='roles'>配置负责人</button></div></div>`;
return `${state.proposal?`<div class='planhint'><span><strong>负责人提出了一项调整</strong>　新增“登录接口异常测试”，尚未执行。</span><button class='small' data-act='proposal'>审阅变更 →</button></div>`:''}<div class='graphbar'><div class='row'><button class='small' data-act='tree'>${state.tree?'切回流程图':'层级视图'}</button><span class='muted' style='font-size:11px'>流程 v3 · 示例基线</span></div><div class='legend'><span><i style='background:var(--green)'></i>已确认</span><span><i style='background:var(--purple)'></i>待你确认</span><span><i style='background:var(--amber)'></i>等待依赖</span></div><div class='row'><button class='small' data-act='zoom-out' aria-label='缩小流程图'>−</button><span class='muted' style='font-size:11px'>${Math.round(state.zoom*100)}%</span><button class='small' data-act='zoom-in' aria-label='放大流程图'>＋</button><button class='small' data-act='fit'>重置视图</button></div></div>${state.tree?`<div class='tree'><h2>个人网站 / 登录功能</h2>${Object.entries(tasks).map(([id,t])=>`<div class='item'><div><span class='title'>${t.role} · ${t.name}</span><p>${t.tool} · ${t.label}<br>依赖：${t.dependency}</p></div><button class='small' data-act='task' data-id='${id}'>查看工作 →</button></div>`).join('')}</div>`:`<div class='graphviewport' id='graph-scroll'><div style='width:${1080*state.zoom}px;height:${550*state.zoom}px'><div class='graph' style='transform:scale(${state.zoom})'><span class='phase' style='left:40px'>01　规划与契约</span><span class='phase' style='left:385px'>02　并行开发 · 独立 WORKTREE</span><span class='phase' style='left:735px'>03　集成与验证</span><svg width='1080' height='550' aria-hidden='true'><defs><marker id='arrow' markerWidth='8' markerHeight='8' refX='7' refY='4' orient='auto'><path d='M0 0L8 4L0 8' fill='none' stroke='#b9c4d6'/></marker></defs><g fill='none' stroke='#bcc7d8' stroke-width='1.5' marker-end='url(#arrow)'><path d='M302 268 C345 268 340 164 381 164'/><path d='M302 268 C345 268 340 386 381 386'/><path d='M647 164 C695 164 685 268 731 268' stroke-dasharray='5 5'/><path d='M647 386 C695 386 685 268 731 268' stroke-dasharray='5 5'/></g></svg>${node('plan',40,195)}${node('front',385,88)}${node('back',385,310)}${node('test',735,195)}<span class='graphnote'>实线：已确认前置关系　虚线：尚待成果确认　·　点击节点查看目标与会话</span></div></div></div>`}`;}
function attention(){if(!project().sample)return `<div class='empty'><h2>暂时没有需要处理的事项</h2><p>等待确认、交接、审批与失败等事项会在这里汇集。</p></div>`;return `<div class='list'><div class='sectionline'><div><h2>需要我处理</h2><p>关闭弹窗不会清除这里的事项，处理结果会同步到节点。</p></div></div>${!state.accepted?`<div class='item'><div><span class='state review'>成果待确认</span><p class='title'>后端 · 登录接口已提交成果</p><p>示例：接口测试通过，等待审查本轮变更与交接说明。</p></div><button data-act='task' data-id='back'>审查成果 →</button></div>`:''}<div class='item'><div><span class='state review'>流程调整待批准</span><p class='title'>负责人建议增加异常测试节点</p><p>尚未批准，不会自动创建工作区或启动 Agent。</p></div><button data-act='proposal'>审阅方案 →</button></div></div>`;}
function flow(){return chrome(`${header()}<section class='overviewhead'><div class='eyebrow'>PROJECT FLOW</div><div class='row between'><h1>${esc(project().name)}</h1><button class='small' data-act='manual'>＋ 添加节点</button></div><p class='lead'>${esc(project().description||'从当前状态建立分工与流程。')}</p><nav class='tabs' aria-label='项目视图'><button data-act='flow' class='${state.tab==='flow'?'selected':''}'>项目流程</button><button data-act='attention' class='${state.tab==='attention'?'selected':''}'>需要我处理 ${project().sample?pending():0}</button><button data-act='roles'>角色与 Agent</button></nav></section>${state.tab==='attention'?attention():graph()}`);}
function chat(id,second=false){const t=tasks[id];const messages=state.messages[id]||[];return `<section class='conversation'><div class='chatname'><span class='agentidentity'>${agentIcon(t.tool)}<b>${t.role}</b> · ${t.tool} · 配置模型（示例）</span>${second?`<button class='small quiet' data-act='compare'>关闭并排 ×</button>`:`<span class='state ${t.status}'>${t.label}</span>`}</div><div class='messages'><article class='message user'><div class='by'>你 · 示例工作要求</div><p>${esc(t.goal)}</p><p>只修改本任务范围；遵循接口约定，保留检查结果和需要协调的问题。</p></article><article class='message'><div class='by agentidentity'>${agentIcon(t.tool)}${t.tool} · 示例回复</div>${id==='back'?`<p>登录接口已实现，并补充了成功、凭据错误和会话过期场景的测试。</p><pre>POST /api/login\n200 → { user, session }\n401 → { code: 'invalid_credentials' }</pre><p>当前成果等待你确认。确认后，可以整理接口约定与具体版本，交接给前端。</p>`:id==='front'?`<p>表单和错误状态已经搭好。我需要确认后端当前可交接的接口版本，再完成真实联调。</p><p>依赖：后端 · 登录接口。当前没有从其他会话自动读取消息。</p>`:id==='plan'?`<p>当前批准的流程是前后端并行开发，成果分别确认，再进入集成验证。</p><p>建议额外增加异常测试节点，变更草案等待你批准。</p>`:`<p>集成分支将从明确的基线建立。前后端成果尚未全部确认，目前等待依赖，不自动开始执行。</p>`}</article>${id==='back'&&!state.accepted?`<div class='evidence'><div class='row between'><strong>本轮成果 · 待你确认</strong><span class='tag'>示例证据</span></div><p>3 个文件变更 · 测试 12/12 · 未集成<br>这些数字仅用于设计展示，未运行真实检查。</p><div class='actions'><button class='small' data-act='artifacts'>查看 diff 与检查</button><button class='small primary' data-act='accept'>确认本轮成果</button></div></div>`:''}${messages.map(m=>`<article class='message user'><div class='by'>你 · 本地演示消息</div><p>${esc(m)}</p></article>`).join('')}</div><form class='composer' data-chat='${id}'><textarea aria-label='${t.role}会话消息' data-draft='${id}' placeholder='向${t.role} Agent 发送反馈…（仅演示，不调用模型）'>${esc(state.drafts[id]||'')}</textarea><div class='composerfoot'><span>会话与 worktree 属于本任务</span><button class='primary small' type='submit'>发送示例消息 ↑</button></div></form></section>`;}
function details(t){return `<aside class='details'><h3>工作依据</h3><dl><dt>角色 / 执行工具</dt><dd class='agentidentity'>${agentIcon(t.tool)}${t.role} / ${t.tool}</dd><dt>前置依赖</dt><dd>${t.dependency}</dd><dt>工作分支</dt><dd class='mono'>${t.branch}</dd><dt>Worktree</dt><dd class='mono'>&lt;worktree-root&gt;/${state.task}</dd><dt>代码基线</dt><dd>已确认的项目 commit<br><span class='muted'>预览不读取真实 Git</span></dd><dt>执行范围</dt><dd>本任务会话与独立工作区；其他会话的消息需明确交接。</dd></dl><button class='small' data-act='workspace'>查看工作区</button></aside>`;}
function task(){const t=tasks[state.task];return chrome(`${header()}<section class='taskhead'><div class='row between'><h1>${t.role} · ${t.name}</h1><div class='actions'><button class='small' data-act='compare'>${state.compare?'关闭并排':'并排查看另一会话'}</button><button class='small' data-act='details'>${state.details?'收起详情':'展开详情'}</button></div></div><div class='summary'>${t.goal}</div><nav class='tabs'><button data-act='chat' class='${state.taskTab==='chat'?'selected':''}'>会话</button><button data-act='artifacts' class='${state.taskTab==='artifacts'?'selected':''}'>成果与检查</button><button data-act='workspace' class='${state.taskTab==='workspace'?'selected':''}'>Worktree</button></nav></section>${state.taskTab==='chat'?`<div class='taskbody ${state.compare?'compare':''}'>${chat(state.task)}${state.compare?chat(state.task==='front'?'back':'front',true):state.details?details(t):''}</div>`:state.taskTab==='artifacts'?`<div class='artifact'><h2>本轮成果与检查</h2><p class='muted'>设计示例 · 未读取实际文件，检查未真实运行。</p><pre>基线：项目确认的 commit\n分支：${t.branch}\n变更：3 个文件（示例）\n检查：12/12（示例）\n集成：尚未执行</pre><div class='actions'><button data-act='chat'>返回会话</button>${state.task==='back'&&!state.accepted?`<button class='primary' data-act='accept'>审阅并确认成果</button>`:''}<button data-act='handoff'>准备交接</button><button data-act='integration'>审阅集成方案</button></div></div>`:`<div class='artifact'><h2>任务独立工作区</h2><p class='muted'>以下为占位信息。正式界面展示实际路径、分支、基线与命令。</p><pre>worktree: &lt;worktree-root&gt;/${state.task}\nbranch: ${t.branch}\nowner: ${t.role} · ${t.name}\nbaseline: 已确认 commit</pre><div class='actions'><button data-act='external'>在 IDE 中打开</button><button data-act='external'>打开终端</button></div></div>`}`);}
let graphPosition={left:0,top:0};
const chatPositions={};
function render(){const graph=$('#graph-scroll');if(graph)graphPosition={left:graph.scrollLeft,top:graph.scrollTop};document.querySelectorAll('form[data-chat]').forEach(form=>{chatPositions[form.dataset.chat]=form.parentElement.querySelector('.messages').scrollTop;});$('#app').innerHTML=state.page==='home'?home():state.page==='flow'?flow():task();const next=$('#graph-scroll');if(next){next.scrollLeft=graphPosition.left;next.scrollTop=graphPosition.top;}document.querySelectorAll('form[data-chat]').forEach(form=>{form.parentElement.querySelector('.messages').scrollTop=chatPositions[form.dataset.chat]||0;});document.querySelectorAll('.nav button').forEach(button=>button.setAttribute('aria-label',button.textContent.trim()));}
let returnFocus;
function modal(title,body,footer){const d=$('#dialog');returnFocus=document.activeElement;d.innerHTML=`<div class='dialoghead'><h2>${title}</h2><button class='quiet small' data-act='close' aria-label='关闭对话框'>×</button></div><div class='dialogbody'>${body}</div><div class='dialogfoot'>${footer||`<button data-act='close'>关闭</button>`}</div>`;d.showModal();}
$('#dialog').addEventListener('close',()=>{if(returnFocus?.isConnected)returnFocus.focus();});
function close(){if($('#dialog').open)$('#dialog').close();}
function notify(title,description,target='back'){const container=$('#notifications');container.innerHTML=`<section class='toast' role='status'><div class='row between'><strong>${title}</strong><button class='quiet small' data-act='dismiss' aria-label='关闭提醒'>×</button></div><p>${description}</p><div class='actions'><button class='small primary' data-act='notification-task' data-id='${target}'>前往处理 →</button><button class='small quiet' data-act='dismiss'>稍后</button></div></section>`;}
function create(importing=false){modal(importing?'接入已有项目':'创建项目空间',`<p class='muted'>${importing?'关联已有开发成果，从当前状态规划后续工作。':'先建立项目空间，稍后再关联仓库、配置 Agent。'}</p><label class='field'><span>项目名称 *</span><input id='project-name' maxlength='80' placeholder='例如：个人网站'></label><label class='field'><span>项目说明</span><textarea id='project-description' rows='2' placeholder='项目目标或当前迭代方向'></textarea></label>${importing?`<label class='field'><span>已有 Git 仓库路径 *</span><input id='project-path' placeholder='选择或输入本地目录'><small>设计稿仅接受路径文本，不读取目录或修改仓库。</small></label><div class='noticebox'>下一步核对分支、commit、未提交改动和 worktree，再确认代码基线。已有功能由你确认，不根据文件存在自动标为完成。</div>`:`<div class='noticebox'>创建不会调用模型、创建代码仓库或启动任务。</div>`}`,`<button data-act='close'>取消</button><button class='primary' data-act='${importing?'inspect-import':'save-project'}'>${importing?'查看接入步骤':'创建项目'}</button>`);}
let pendingProject;
document.addEventListener('input',e=>{if(e.target.dataset?.draft)state.drafts[e.target.dataset.draft]=e.target.value;});
document.addEventListener('submit',e=>{const id=e.target.dataset.chat;if(!id)return;e.preventDefault();const text=(state.drafts[id]||'').trim();if(!text)return;(state.messages[id]??=[]).push(text);state.drafts[id]='';render();});
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const act=b.dataset.act;
if(act==='close')return close();if(act==='dismiss'){$('#notifications').innerHTML='';return;}
if(act==='global-back'){if(state.page==='home')return;state.page=state.page==='task'?'flow':'home';state.tab='flow';render();return;}
if(act==='home'){state.page='home';render();return;}
if(act==='create'||act==='import'){create(act==='import');return;}
if(act==='save-project'||act==='inspect-import'){const name=$('#project-name').value.trim(),description=$('#project-description').value.trim(),path=$('#project-path')?.value.trim()||'';if(!name||(act==='inspect-import'&&!path)){const input=!name?$('#project-name'):$('#project-path');input.setCustomValidity('请填写此项');input.reportValidity();input.addEventListener('input',()=>input.setCustomValidity(''),{once:true});return;}pendingProject={id:'project-'+Date.now(),name,description,path};if(act==='inspect-import'){close();modal('确认接入方式',`<p><b>${esc(name)}</b></p><p class='mono'>${esc(path)}</p><div class='noticebox'><b>这是接入流程预览，尚未扫描真实仓库。</b><br>实际产品应先展示检测出的当前分支、HEAD、未提交改动和已有 worktree。</div><label class='field'><span>代码基线处理方式（示意）</span><select><option>核对仓库后选择已提交的 commit</option><option>先在 IDE / 终端处理未提交改动，再重新检测</option></select><small>不会自动提交、stash、重置或覆盖改动；未提交修改不会自动进入新 worktree。</small></label>`,`<button data-act='close'>取消</button><button class='primary' data-act='finish-import'>仅创建预览项目空间</button>`);return;}state.imported.push(pendingProject);state.project=pendingProject.id;state.page='flow';state.tab='flow';close();render();return;}
if(act==='finish-import'){state.imported.push(pendingProject);state.project=pendingProject.id;state.page='flow';state.tab='flow';close();render();return;}
if(act==='sample'||act==='open-project'){state.project=act==='sample'?'sample':b.dataset.id;state.page='flow';state.tab='flow';render();return;}
if(act==='flow'||act==='attention'){state.page='flow';state.tab=act==='flow'?'flow':'attention';render();return;}
if(act==='task'||act==='notification-task'){state.project='sample';state.page='task';state.task=b.dataset.id;state.taskTab='chat';state.compare=false;if(act==='notification-task')$('#notifications').innerHTML='';render();return;}
if(act==='chat'||act==='artifacts'||act==='workspace'){state.taskTab=act==='chat'?'chat':act==='artifacts'?'artifacts':'workspace';render();return;}
if(act==='compare'){state.compare=!state.compare;state.taskTab='chat';render();return;}if(act==='details'){state.details=!state.details;render();return;}
if(act==='tree'){state.tree=!state.tree;render();return;}if(act==='zoom-in'||act==='zoom-out'||act==='fit'){state.zoom=act==='fit'?1:Math.max(.6,Math.min(1.3,state.zoom+(act==='zoom-in'?.1:-.1)));render();return;}
if(act==='reminder'){notify('后端 · 登录接口等待确认','示例提醒：查看本轮成果，确认后再安排交接。关闭提醒不会清除节点标记。');return;}
if(act==='proposal'){modal('审阅流程变更草案',`<p class='muted'>负责人提出 · 尚未执行</p><label class='checkline'><input type='checkbox' checked><span><b>新增：测试 · 登录接口异常测试</b><small>依赖：后端登录接口成果确认。工具：DeepSeek Harness（示例）。</small></span></label><div class='noticebox'>影响：集成验证增加异常测试前置依赖。批准工作范围与立即启动是分开的；受阻节点等待条件满足。</div>`,`<button data-act='close'>稍后</button><button class='primary' data-act='approve-proposal'>确认所选草案（预览）</button>`);return;}
if(act==='approve-proposal'){close();notify('已预览批准流程','这份稿件尚未实现图结构编辑；真实产品应创建对应节点及版本记录，当前没有启动 Agent。','plan');return;}
if(act==='accept'){modal('确认登录接口本轮成果',`<p>审查对象：<b>后端 · 登录接口</b></p><div class='noticebox'>示例版本：login-api / 本轮快照<br>示例检查：12/12<br>确认不等于代码已集成，不自动通知前端或启动其他工作。</div>`,`<button data-act='close'>继续审查</button><button class='primary' data-act='accept-done'>确认成果（预览）</button>`);return;}
if(act==='accept-done'){state.accepted=true;tasks.back.status='done';tasks.back.label='已确认';close();render();notify('后端成果已确认 · 预览','前端仍等待交接。你可以整理交接内容，审阅后再发送。');return;}
if(act==='handoff'){modal('准备交接给前端',`<p class='muted'>交接草案由负责人整理，以下为示例内容。</p><label class='field'><span>接收任务</span><input value='前端 · 登录页面' readonly></label><label class='field'><span>交接内容</span><textarea rows='6'>接口：POST /api/login\n返回字段与错误码：依据已确认接口文档\n代码依据：指定已确认 commit / 快照\n未解决事项：确认会话过期后的页面行为</textarea></label><div class='noticebox'>发送与接收均需有记录；不会假定前端自动看过后端会话。</div>`,`<button data-act='close'>取消</button><button class='primary' data-act='handoff-done'>确认发送（预览）</button>`);return;}
if(act==='handoff-done'){close();notify('交接操作预览','真实实现应保存交接版本并发送给指定会话；本稿件没有实际发送消息。','front');return;}
if(act==='integration'){modal('审阅集成计划',`<p>目标分支：<span class='mono'>agentdesk/integration-login</span></p><div class='noticebox'>来源：前端与后端已确认的具体 commit<br>步骤：检查依赖与工作区 → 集成 → 运行检查<br>冲突：停止并交给你或指定 Agent 处理<br><b>当前示例依赖未齐，不可执行集成。</b></div>`,`<button data-act='close'>返回</button><button class='primary' disabled>等待前置成果</button>`);return;}
if(act==='roles'){modal('项目角色与负责人',`<p class='muted'>角色配置可复用，每个开发任务建立独立会话与 worktree。</p>${[['负责人','Codex','规划与协调，方案经你批准'],['前端','Claude Code','页面、组件与前端联调'],['后端','Codex','接口、数据与后端实现'],['测试','DeepSeek Harness','检查与集成验证']].map(([r,t,d])=>`<div class='item'><div><b>${r}</b><p>${d}</p></div><span class='tag agentidentity'>${agentIcon(t)}${t} · 示例</span></div>`).join('')}<p class='muted' style='font-size:11px'>三工具是设计目标；本稿未连接，实际接入需分别验证。</p>`);return;}
if(act==='manual'){modal('添加工作节点',`<label class='field'><span>任务名称</span><input placeholder='例如：登录页面'></label><label class='field'><span>角色</span><select><option>前端</option><option>后端</option><option>测试</option></select></label><label class='field'><span>目标与验收条件</span><textarea rows='3' placeholder='明确执行范围与完成依据'></textarea></label><div class='noticebox'>创建为草案，批准后才准备 worktree 并执行。本预览暂不保存节点编辑。</div>`,`<button data-act='close'>关闭预览</button>`);return;}
if(act==='external'){modal('外部开发工具入口',`<p>正式产品会针对本任务 worktree 打开所配置的 IDE 或终端。</p><p class='muted'>此设计稿没有文件系统或子进程操作。</p>`);return;}
if(act==='settings'){modal('项目配置入口',`<p>仓库与代码基线、角色和执行配置、工作区根目录、检查预设、通知偏好。</p><p class='muted'>此处仅标示设置入口，配置细节在下一轮设计。关闭软件存在运行任务时，应询问后台继续或停止后退出。</p>`);return;}
});
render();
</script></body></html>
